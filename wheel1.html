<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بطاقات هدايا أمازون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background:
      radial-gradient(circle at 50% 28%, rgba(20, 126, 76, .34), transparent 38%),
      radial-gradient(circle at 50% 0%, #075438 0%, #003624 48%, #001f17 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 18px 14px 40px;
    color: #f4f8fc;
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .75;
    background:
      radial-gradient(circle at 8% 18%, #ffe679 0 2px, transparent 3px),
      radial-gradient(circle at 90% 24%, #ffe679 0 2px, transparent 3px),
      radial-gradient(circle at 13% 57%, #ffe679 0 1px, transparent 3px),
      radial-gradient(circle at 86% 65%, #ffe679 0 2px, transparent 4px),
      radial-gradient(circle at 22% 85%, #ffe679 0 1px, transparent 3px);
  }

  /* ====================================================================
     المحتوى القابل للتعديل: العنوان، الوصف الفرعي، ونص الوسط
     غيّري النصوص هنا براحتك من غير ما تلمسي أي حاجة تانية
     ==================================================================== */

  h1 {
    font-size: clamp(27px, 7vw, 35px); font-weight: 900; text-align: center;
    margin: 15px 0 5px; color: #f7ce62;
    text-shadow: 0 3px 10px rgba(0,0,0,.52), 0 0 20px rgba(247,206,98,.2);
  }
  .sub { font-size: 15px; font-weight: 700; color: #f6e6b2; text-align: center; margin-bottom: 24px; }

  .brand {
    background: linear-gradient(180deg, #fff0a4 0%, #efc553 42%, #bd7f08 100%);
    color: #06452f; font-weight: 900; font-size: 23px;
    padding: 8px 28px; border: 2px solid #ffe99a; border-radius: 24px;
    box-shadow: 0 5px 0 #754600, 0 8px 22px rgba(216, 163, 36, 0.48), inset 0 2px 5px #fff8d3;
  }

  .wheel-wrap {
    position: relative;
    width: min(94vw, 390px);
    aspect-ratio: 1 / 1;
    margin: 2px 0 24px;
  }

  .pin {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 54px;
    z-index: 6;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.55));
  }

  .lights-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, #ffe89a, #a96500 40%, #ffd866 72%, #734000);
    box-shadow: 0 18px 45px rgba(0,0,0,0.68), 0 0 24px rgba(255,204,72,.28), inset 0 0 0 3px #fff0ad;
  }
  .bulb {
    position: absolute;
    width: 5.6%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fffbe6, #ffd873 55%, #b8860b 100%);
    box-shadow: 0 0 6px 2px rgba(255, 216, 115, 0.75);
    transform: translate(-50%, -50%);
  }

  .gold-rim {
    position: absolute;
    inset: 7.5%;
    border-radius: 50%;
    background: linear-gradient(145deg, #fff5c9, #c1840f 42%, #ffe88f 72%, #925900);
    padding: 3.2%;
    box-shadow: inset 0 0 0 2px #fff2b1, 0 0 0 2px #8e5900;
  }

  canvas#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    transition: transform 5.5s cubic-bezier(0.12, 0.72, 0.14, 1);
  }
  #goldenWheelImage {
    display: none; position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; transform-origin: 50% 50%;
    transition: transform 5.5s cubic-bezier(0.12, 0.72, 0.14, 1);
    filter: drop-shadow(0 18px 28px rgba(0,0,0,.58));
  }
  body.golden-mode .lights-ring { display: none; }
  body.golden-mode .gold-rim {
    inset: 7.5%;
    padding: 3.2%;
    background: linear-gradient(145deg, #fff5c9, #c1840f 42%, #ffe88f 72%, #925900);
    box-shadow: inset 0 0 0 2px #fff2b1, 0 0 0 2px #8e5900, 0 16px 30px rgba(0,0,0,.45);
  }
  body.golden-mode canvas#wheel,
  body.golden-mode #labels,
  body.golden-mode .hub { display: block; }
  body.golden-mode #goldenWheelImage { display: none; }
  #labels {
    position: absolute;
    inset: 12.5%;
    border-radius: 50%;
    pointer-events: none;
    transition: transform 5.5s cubic-bezier(0.12, 0.72, 0.14, 1);
  }
  .label {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    direction: rtl;
    white-space: nowrap;
    min-width: 78px;
    min-height: 72px;
    transform-origin: center center;
  }
  .label .bow { font-size: 0; line-height: 0; margin: 0; }
  .label .amt {
    font-size: clamp(36px, 10vw, 50px);
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .label .subtext {
    font-size: clamp(18px, 5vw, 25px);
    font-weight: 900;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    margin-top: 1px;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 17%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff9e0, #ffd873 45%, #b8860b 85%, #8a6206 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.5);
    z-index: 4;
  }

  button#spin {
    background: linear-gradient(135deg, #ffe27a, #d8a324);
    color: #3a2604;
    border: none;
    width: min(78vw, 320px); font-size: 23px;
    font-weight: 900;
    padding: 16px 36px;
    border-radius: 30px;
    border: 2px solid #fff0a5;
    box-shadow: 0 6px 0 #754600, 0 12px 28px rgba(216, 163, 36, 0.46), inset 0 2px 6px #fffbd9;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button#spin:active { transform: scale(0.96); }
  button#spin:disabled { opacity: 0.55; box-shadow: none; cursor: default; }

  .result {
    display: none;
    margin-top: 22px;
    text-align: center;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 226, 122, 0.4);
    border-radius: 18px;
    padding: 18px 26px;
    max-width: 300px;
  }
  .result.show { display: block; animation: pop 0.4s ease; }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result-title { font-size: 13px; color: #bcd9c8; margin-bottom: 6px; }
  .result-prize { font-size: 20px; font-weight: 800; color: #ffe27a; }
  .gift-box {
    display: none;
    position: relative;
    margin: 6px 0 24px;
    border: 0;
    background: transparent;
    width: min(82vw, 330px); height: min(82vw, 330px);
    cursor: pointer;
    filter: drop-shadow(0 14px 20px rgba(216, 163, 36, 0.5));
    animation: giftPulse 1s ease-in-out infinite alternate;
  }
  .gift-box.show { display: block; }
  .gift-box img { width: 100%; height: 100%; object-fit: contain; display: block; }
  @keyframes giftPulse { from { transform: scale(0.96); } to { transform: scale(1.08); } }
  .open-hint { display: none; color: #ffe27a; margin-top: 5px; font-weight: 700; }
  .open-hint.show { display: block; }
  .hint { font-size: 12px; color: #86a396; margin-top: 24px; text-align: center; max-width: 280px; line-height: 1.6; }

  .wheel-wrap.finished {
    display: none;
  }
  button#spin.finished {
    display: none;
  }

</style>
</head>
<body>

<div class="brand">وفر كاش</div>
<h1>عجلة بطاقات الهدايا 🎁</h1>
<p class="sub">لف عجلة الهدايا وبعد ما تقف افتح صندوقك</p>

<div class="wheel-wrap">
  <svg class="pin" viewBox="0 0 44 54">
    <path d="M22 54 C10 38 3 27 3 17 A19 19 0 0 1 41 17 C41 27 34 38 22 54 Z" fill="url(#pinGrad)" stroke="#8a6206" stroke-width="1"/>
    <circle cx="22" cy="17" r="8" fill="#fff9e0"/>
    <defs>
      <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff3c4"/>
        <stop offset="100%" stop-color="#c8931e"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="lights-ring" id="lightsRing"></div>

  <div class="gold-rim">
    <canvas id="wheel" width="600" height="600"></canvas>
    <div id="labels"></div>
    <img id="goldenWheelImage" src="golden_wheel.png" alt="عجلة بطاقات الهدايا">
  </div>

  <div class="hub"></div>
</div>

<button id="spin">🎡 لف عجلة الهدايا وافتح صندوقك</button>

<button class="gift-box" id="giftBox" aria-label="افتح صندوق الجائزة">
  <img src="golden_gift_box.png" alt="صندوق الجائزة">
</button>
<div class="open-hint" id="openHint">دوس على الصندوق وافتح جائزتك</div>

<div class="result" id="result">
  <div class="result-title">مبروك! كسبت</div>
  <div class="result-prize" id="prizeText">—</div>
</div>

<p class="hint">لفة واحدة بس لكل حساب. هديتك هتتأكد وتوصلك من فريق الدعم خلال يومين.</p>

<script>
/* ====================================================================
   المحتوى القابل للتعديل: قائمة الهدايا
   - label: النص الرئيسي (المبلغ عادة)
   - sub: نص فرعي صغير تحت المبلغ (زي "بطاقة هدايا" أو وصف الهدية)
   - weight: احتمالية الفوز بيها (كل ما الرقم أكبر كل ما الفرصة أكبر)
   - color1/color2: تدرّج لون قطعة العجلة (شكل بطاقة الهدايا)
   ==================================================================== */
/* ====================================================================
   المحتوى القابل للتعديل: قائمة الهدايا
   3 أرقام (قيمة بالجنيه) + 3 بطاقات (فضية/ذهبية/برونزية - تفاصيلها
   وقيمتها لسه هتتحدد بعدين، دي بس أماكنها جاهزة دلوقتي)
   ==================================================================== */
const prizes = [
  { label: "0.5", sub: "جنيه", full: "0.5 جنيه", weight: 46, color1: "#7B4FB5", color2: "#4B2876" },
  { label: "1",   sub: "جنيه", full: "1 جنيه",   weight: 27, color1: "#C7C7C7", color2: "#8A8A8A" },
  { label: "2",   sub: "جنيه", full: "2 جنيه",   weight: 16, color1: "#2FBF9F", color2: "#177A64" },
  { label: "3",   sub: "جنيه", full: "3 جنيه",   weight: 7,  color1: "#FF9A3D", color2: "#D9600C" },
  { label: "5",   sub: "جنيه", full: "5 جنيه",   weight: 3,  color1: "#3A3A3A", color2: "#141414" },
  { label: "10",  sub: "جنيه", full: "10 جنيه",  weight: 1,  color1: "#D8A324", color2: "#8A6206" }
];

/* ====================================================================
   هدايا وضع "العروض الذهبية" - بتتفعّل لو الرابط فيه ?mode=golden
   (Placeholder مبدئي - عدّليها زي ما تحبي)
   ==================================================================== */
/* ====================================================================
   روليت الجائزة الشخصية: القطاعات كلها رموز بلا أرقام. مبلغ الجائزة الحقيقي
   يجي جاهزًا من السيرفر في ?prize= ولا يظهر إلا بعد فتح الصندوق.
   ==================================================================== */
const goldenPrizes = [
  { label: "🎁", sub: "مفاجأة", full: "مفاجأة", weight: 1, color1: "#7B4FB5", color2: "#4B2876" },
  { label: "✨", sub: "مبروك",  full: "مبروك",  weight: 1, color1: "#C7C7C7", color2: "#8A8A8A" },
  { label: "💰", sub: "كاش",    full: "كاش",    weight: 1, color1: "#2FBF9F", color2: "#177A64" },
  { label: "⭐", sub: "هدية",   full: "هدية",   weight: 1, color1: "#FF9A3D", color2: "#D9600C" },
  { label: "🏆", sub: "فوز",    full: "فوز",    weight: 1, color1: "#3A3A3A", color2: "#141414" },
  { label: "💫", sub: "حظك",    full: "حظك",    weight: 1, color1: "#D8A324", color2: "#8A6206" }
];

const pageMode = new URLSearchParams(window.location.search).get('mode');
const isSelectMode = pageMode === 'select';
// فتح الملف مباشرة من غير mode يعرض العجلة الجديدة، مش العجلة القديمة.
const isGoldenMode = pageMode === 'golden' || !pageMode;

/* ====================================================================
   وضع "الاختيار" - عجلة بصرية بس (بدون قيم حقيقية) بتختار عرض عشوائي
   قبل ما نطلع السؤال. القيم هنا شكلية للحماس بس، مش لها قيمة فعلية.
   ==================================================================== */
const selectPrizes = [
  { label: "🎁", sub: "عرض", full: "عرض", weight: 1, color1: "#2E3A6B", color2: "#161B33" },
  { label: "🏆", sub: "عرض", full: "عرض", weight: 1, color1: "#D8A324", color2: "#8A6206" },
  { label: "⭐", sub: "عرض", full: "عرض", weight: 1, color1: "#2FBF9F", color2: "#177A64" },
  { label: "🔥", sub: "عرض", full: "عرض", weight: 1, color1: "#FF9A3D", color2: "#D9600C" },
  { label: "🎯", sub: "عرض", full: "عرض", weight: 1, color1: "#C7C7C7", color2: "#8A8A8A" },
  { label: "💫", sub: "عرض", full: "عرض", weight: 1, color1: "#B5651D", color2: "#7A3E10" }
];

const activePrizes = isGoldenMode ? goldenPrizes : (isSelectMode ? selectPrizes : prizes);
if (isSelectMode) {
  document.querySelector('h1').textContent = 'عجلة العروض الذهبية';
  document.querySelector('.sub').textContent = 'لف واختار عرضك';
  document.querySelector('.hint').textContent = 'بعد ما العجلة تقف، هيوصلك تفاصيل العرض والسؤال.';
}
if (isGoldenMode) {
  document.body.classList.add('golden-mode');
  document.querySelector('h1').textContent = 'عجلة بطاقات الهدايا 🎁';
  document.querySelector('.sub').textContent = 'لف عجلة الهدايا وبعد ما تقف افتح صندوقك';
  document.querySelector('.hint').textContent = 'قيمة الجائزة محسوبة من إجاباتك الصحيحة في الجولة.';
}
/* ==================================================================== */

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const N = activePrizes.length;
const seg = (2 * Math.PI) / N;
const R = canvas.width / 2;

function drawWheel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < N; i++) {
    const start = i * seg - Math.PI / 2;
    const end = start + seg;

    ctx.beginPath();
    ctx.moveTo(R, R);
    ctx.arc(R, R, R, start, end);
    ctx.closePath();

    const mid = start + seg / 2;
    const x1 = R + Math.cos(mid) * R * 0.15;
    const y1 = R + Math.sin(mid) * R * 0.15;
    const x2 = R + Math.cos(mid) * R;
    const y2 = R + Math.sin(mid) * R;
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, activePrizes[i].color1);
    grad.addColorStop(1, activePrizes[i].color2);
    ctx.fillStyle = grad;
    ctx.fill();

    const shine = ctx.createRadialGradient(R, R, R * 0.1, R, R, R);
    shine.addColorStop(0, "rgba(255,255,255,0.28)");
    shine.addColorStop(0.4, "rgba(255,255,255,0.05)");
    shine.addColorStop(1, "rgba(0,0,0,0.12)");
    ctx.fillStyle = shine;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}
drawWheel();

const labelsLayer = document.getElementById('labels');
const LABEL_RADIUS_PERCENT = 58; // بعد النص عن مركز العجلة (بعيد عن المسمار الدهبي)
function drawLabels() {
  labelsLayer.innerHTML = "";
  for (let i = 0; i < N; i++) {
    const mid = i * seg + seg / 2 - Math.PI / 2;
    const midDeg = mid * (180 / Math.PI) + 90;
    const x = 50 + LABEL_RADIUS_PERCENT * Math.cos(mid);
    const y = 50 + LABEL_RADIUS_PERCENT * Math.sin(mid);

    const el = document.createElement('div');
    el.className = 'label';
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.dataset.index = i;
    el.style.transform = `translate(-50%, -50%) rotate(0deg)`;

    const bow = document.createElement('span');
    bow.className = 'bow';
    bow.textContent = '🎀';
    el.appendChild(bow);

    const amt = document.createElement('span');
    amt.className = 'amt';
    amt.textContent = activePrizes[i].label;
    el.appendChild(amt);

    const sub = document.createElement('span');
    sub.className = 'subtext';
    sub.textContent = activePrizes[i].sub;
    el.appendChild(sub);

    labelsLayer.appendChild(el);
  }
}
drawLabels();

function updateLabelPositions(rotationDeg = 0) {
  const labels = labelsLayer.querySelectorAll('.label');
  labels.forEach((el, i) => {
    const baseMid = i * seg + seg / 2 - Math.PI / 2;
    const rotatedMid = baseMid + (rotationDeg * Math.PI / 180);
    const x = 50 + LABEL_RADIUS_PERCENT * Math.cos(rotatedMid);
    const y = 50 + LABEL_RADIUS_PERCENT * Math.sin(rotatedMid);
    el.style.left = x + '%';
    el.style.top = y + '%';
    // مهم: النص يفضل واقف بالعرض مهما العجلة تلف
    el.style.transform = 'translate(-50%, -50%) rotate(0deg)';
  });
}

const lightsRing = document.getElementById('lightsRing');
const BULB_COUNT = 16;
const BULB_RADIUS_PERCENT = 46.5;
for (let i = 0; i < BULB_COUNT; i++) {
  const angleRad = (i / BULB_COUNT) * 2 * Math.PI - Math.PI / 2;
  const x = 50 + BULB_RADIUS_PERCENT * Math.cos(angleRad);
  const y = 50 + BULB_RADIUS_PERCENT * Math.sin(angleRad);
  const bulb = document.createElement('div');
  bulb.className = 'bulb';
  bulb.style.left = x + '%';
  bulb.style.top = y + '%';
  lightsRing.appendChild(bulb);
}

function pickPrizeIndex() {
  const total = activePrizes.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < N; i++) {
    if (r < activePrizes[i].weight) return i;
    r -= activePrizes[i].weight;
  }
  return N - 1;
}

let spun = false;
const spinBtn = document.getElementById('spin');
const resultBox = document.getElementById('result');
const prizeText = document.getElementById('prizeText');
const wheelInner = document.querySelector('.gold-rim');
const goldenWheelImage = document.getElementById('goldenWheelImage');
let currentRotation = 0;

if (isSelectMode) {
  spinBtn.textContent = '🎡 لف واختار عروض';
} else if (isGoldenMode) {
  spinBtn.textContent = '🎁 لف عجلة الهدايا وافتح صندوقك';
}


/* ====================================================================
   رصيد اللفّات بيوصل من البوت في رابط الصفحة (?balance=3).
   لو الرصيد صفر أو مش موجود، الزرار يتعطّل تمامًا من الأول.
   (السيرفر/البوت بيتأكد من الرصيد الحقيقي تاني بعد اللف على أي حال،
   الشرط هنا بس عشان تجربة استخدام أوضح للعميل)
   ==================================================================== */
const urlParams = new URLSearchParams(window.location.search);
const availableSpins = parseInt(urlParams.get('balance') || '-1', 10);
const balanceProvided = urlParams.has('balance');

if (balanceProvided && availableSpins <= 0) {
  spinBtn.disabled = true;
  spinBtn.textContent = "معندكش لفّات متاحة 🚫";
  spun = true; // نمنع أي محاولة لف
}

/* ====================================================================
   الجائزة تأتي من السيرفر في ?prize= ومربوطة بـ ?spin_id=. اختيار قطاع
   الروليت بصري فقط، ولا يغيّر قيمة الجائزة المحسوبة من الإجابات الصحيحة.
   ==================================================================== */
const serverSpinId = urlParams.get('spin_id');
const serverPrize = urlParams.get('prize') || '0';

function sendResult(payload) {
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.sendData(JSON.stringify({
        ...payload,
        user_id: tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null
      }));
    }
  } catch (e) {}
}

function animateUprightLabels(fromDeg, toDeg, duration = 5500) {
  const start = performance.now();
  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }
  function frame(now) {
    const p = Math.min(1, (now - start) / duration);
    const eased = easeOutCubic(p);
    const deg = fromDeg + (toDeg - fromDeg) * eased;
    updateLabelPositions(deg);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

spinBtn.addEventListener('click', () => {
  if (spun) return;
  spun = true;
  spinBtn.disabled = true;
  spinBtn.textContent = "بتلف...";

  const winnerIndex = pickPrizeIndex();
  const winnerMidAngleDeg = (winnerIndex * seg + seg / 2) * (180 / Math.PI);
  const fullSpins = 6 * 360;
  const target = fullSpins + (360 - winnerMidAngleDeg);
  currentRotation += target;

  const previousRotation = currentRotation - target;
  canvas.style.transform = `rotate(${currentRotation}deg)`;
  goldenWheelImage.style.transform = `rotate(${currentRotation}deg)`;
  labelsLayer.style.transform = 'none';
  animateUprightLabels(previousRotation, currentRotation, 5500);

  setTimeout(() => {
    spinBtn.textContent = "تم اللف 🎉";

    if (isGoldenMode) {
      document.querySelector('.wheel-wrap').classList.add('finished');
      spinBtn.classList.add('finished');
      const giftBox = document.getElementById('giftBox');
      giftBox.classList.add('show');
      document.getElementById('openHint').classList.add('show');
      giftBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    prizeText.textContent = activePrizes[winnerIndex].full;
    resultBox.classList.add('show');
    sendResult({
      type: isSelectMode ? "golden_select" : "wheel_result",
      prize: activePrizes[winnerIndex].full,
      spin_id: serverSpinId,
      isWin: activePrizes[winnerIndex].isWin !== false
    });
  }, 5600);
});

let giftOpened = false;
document.getElementById('giftBox').addEventListener('click', () => {
  if (giftOpened || !isGoldenMode) return;
  giftOpened = true;
  document.getElementById('giftBox').innerHTML = '<span style="font-size:82px">🎊</span>';
  document.getElementById('openHint').classList.remove('show');
  prizeText.textContent = `${serverPrize} جنيه`;
  resultBox.classList.add('show');
  sendResult({
    type: "golden_prize_result",
    prize: `${serverPrize} جنيه`,
    spin_id: serverSpinId,
    isWin: Number(serverPrize) > 0
  });
});

try {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
} catch (e) {}
</script>
