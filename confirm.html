<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>جاري التحويل...</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1b3a2e 0%, #0d2019 60%, #081210 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #f4f8fc;
    text-align: center;
    padding: 20px;
  }
  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid rgba(255, 216, 115, 0.25);
    border-top-color: #ffd873;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { font-size: 15px; color: #cddbe8; }
  a.fallback {
    margin-top: 22px;
    display: inline-block;
    background: linear-gradient(135deg, #ffd873, #e8a53d);
    color: #402a06;
    font-weight: 800;
    padding: 12px 28px;
    border-radius: 24px;
    text-decoration: none;
  }
</style>
</head>
<body>

<div class="spinner"></div>
<p>بنوديك على أمازون دلوقتي...</p>
<a class="fallback" id="fallbackLink" href="#" style="display:none;">دوس هنا لو مافتحش لوحده</a>

<script>
const params = new URLSearchParams(window.location.search);
const dealId = params.get('deal_id');
const amazonUrl = decodeURIComponent(params.get('url') || '');

document.getElementById('fallbackLink').href = amazonUrl;

try {
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    const userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
    // بنبعت التأكيد للبوت الأول (ده بيقفل الصفحة تلقائيًا وقت الإرسال)
    tg.sendData(JSON.stringify({
      type: "golden_confirm",
      deal_id: dealId,
      user_id: userId
    }));
  }
} catch (e) {}

// احتياط: لو الصفحة فضلت مفتوحة لأي سبب (مش على تليجرام مثلاً)، وديه لأمازون يدوي بعد ثانية
setTimeout(() => {
  if (amazonUrl) window.location.href = amazonUrl;
}, 600);
document.getElementById('fallbackLink').style.display = 'inline-block';
</script>
</body>
</html>
