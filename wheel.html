<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بطاقات هدايا أمازون</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1b3a2e 0%, #0d2019 60%, #081210 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 28px 16px 40px;
    color: #f4f8fc;
    overflow-x: hidden;
  }

  /* ====================================================================
     المحتوى القابل للتعديل: العنوان، الوصف الفرعي، ونص الوسط
     غيّري النصوص هنا براحتك من غير ما تلمسي أي حاجة تانية
     ==================================================================== */

  h1 { font-size: 22px; font-weight: 700; text-align: center; margin: 10px 0 2px; color: #ffffff; }
  .sub { font-size: 14px; color: #bcd9c8; text-align: center; margin-bottom: 26px; }

  .brand {
    background: linear-gradient(135deg, #ffe27a, #d8a324);
    color: #3a2604;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 5px 14px;
    border-radius: 20px;
    box-shadow: 0 4px 14px rgba(216, 163, 36, 0.45);
  }

  .wheel-wrap {
    position: relative;
    width: min(88vw, 340px);
    aspect-ratio: 1 / 1;
    margin-bottom: 30px;
  }

  .pin {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 54px;
    z-index: 6;
    filter: drop-shadow(0 4px 5px rgba(0,0,0,0.55));
  }

  .lights-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(#0f5132, #0a3d24, #0f5132, #0a3d24, #0f5132, #0a3d24, #0f5132, #0a3d24, #0f5132);
    box-shadow: 0 18px 40px rgba(0,0,0,0.6), inset 0 0 0 3px #ffe27a;
  }
  .bulb {
    position: absolute;
    width: 6.5%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fffbe6, #ffd873 55%, #b8860b 100%);
    box-shadow: 0 0 6px 2px rgba(255, 216, 115, 0.75);
    transform: translate(-50%, -50%);
  }

  .gold-rim {
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    background: conic-gradient(#fff3c4, #d8a324, #fff3c4, #d8a324, #fff3c4, #d8a324, #fff3c4, #d8a324, #fff3c4);
    padding: 3.5%;
  }

  canvas#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    transition: transform 5.5s cubic-bezier(0.12, 0.72, 0.14, 1);
  }
  #labels {
    position: absolute;
    inset: 8% + 3.5%;
    inset: 14%;
    border-radius: 50%;
    pointer-events: none;
    transition: transform 5.5s cubic-bezier(0.12, 0.72, 0.14, 1);
  }
  .label {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    direction: rtl;
    white-space: nowrap;
  }
  .label .bow { font-size: 12px; line-height: 1; margin-bottom: 1px; }
  .label .amt {
    font-size: clamp(15px, 4.6vw, 20px);
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  .label .subtext {
    font-size: clamp(8px, 2.3vw, 9.5px);
    font-weight: 700;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    margin-top: 1px;
  }

  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 17%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff9e0, #ffd873 45%, #b8860b 85%, #8a6206 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(255,255,255,0.5);
    z-index: 4;
  }

  button#spin {
    background: linear-gradient(135deg, #ffe27a, #d8a324);
    color: #3a2604;
    border: none;
    font-size: 17px;
    font-weight: 800;
    padding: 15px 46px;
    border-radius: 30px;
    box-shadow: 0 10px 26px rgba(216, 163, 36, 0.45);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  button#spin:active { transform: scale(0.96); }
  button#spin:disabled { opacity: 0.55; box-shadow: none; cursor: default; }

  .result {
    display: none;
    margin-top: 22px;
    text-align: center;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 226, 122, 0.4);
    border-radius: 18px;
    padding: 18px 26px;
    max-width: 300px;
  }
  .result.show { display: block; animation: pop 0.4s ease; }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result-title { font-size: 13px; color: #bcd9c8; margin-bottom: 6px; }
  .result-prize { font-size: 20px; font-weight: 800; color: #ffe27a; }
  .hint { font-size: 12px; color: #86a396; margin-top: 24px; text-align: center; max-width: 280px; line-height: 1.6; }
</style>
</head>
<body>

<div class="brand">بطاقات هدايا أمازون</div>
<h1>عجلة الحظ</h1>
<p class="sub">دوس ولف واكسب بطاقات هدايا أمازون 🎁</p>

<div class="wheel-wrap">
  <svg class="pin" viewBox="0 0 44 54">
    <path d="M22 54 C10 38 3 27 3 17 A19 19 0 0 1 41 17 C41 27 34 38 22 54 Z" fill="url(#pinGrad)" stroke="#8a6206" stroke-width="1"/>
    <circle cx="22" cy="17" r="8" fill="#fff9e0"/>
    <defs>
      <linearGradient id="pinGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fff3c4"/>
        <stop offset="100%" stop-color="#c8931e"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="lights-ring" id="lightsRing"></div>

  <div class="gold-rim">
    <canvas id="wheel" width="600" height="600"></canvas>
    <div id="labels"></div>
  </div>

  <div class="hub"></div>
</div>

<button id="spin">🎡 لف العجلة</button>

<div class="result" id="result">
  <div class="result-title">مبروك! كسبت</div>
  <div class="result-prize" id="prizeText">—</div>
</div>

<p class="hint">لفة واحدة بس لكل حساب. هديتك هتتأكد وتوصلك من فريق الدعم خلال يومين.</p>

<script>
/* ====================================================================
   المحتوى القابل للتعديل: قائمة الجوايز
   - label: النص الرئيسي (المبلغ عادة)
   - sub: نص فرعي صغير تحت المبلغ (زي "بطاقة هدايا" أو وصف الجايزة)
   - weight: احتمالية الفوز بيها (كل ما الرقم أكبر كل ما الفرصة أكبر)
   - color1/color2: تدرّج لون قطعة العجلة (شكل بطاقة الهدايا)
   ==================================================================== */
/* ====================================================================
   المحتوى القابل للتعديل: قائمة الجوايز
   3 أرقام (قيمة بالجنيه) + 3 بطاقات (فضية/ذهبية/برونزية - تفاصيلها
   وقيمتها لسه هتتحدد بعدين، دي بس أماكنها جاهزة دلوقتي)
   ==================================================================== */
const prizes = [
  { label: "30", sub: "جنيه",   full: "30 جنيه",            weight: 0.1, color1: "#2E3A6B", color2: "#161B33" },
  { label: "15", sub: "جنيه",   full: "15 جنيه",            weight: 0.5, color1: "#FF9A3D", color2: "#D9600C" },
  { label: "5",  sub: "جنيه",   full: "5 جنيه",             weight: 3,   color1: "#2FBF9F", color2: "#177A64" },
  { label: "🥇", sub: "بطاقة ذهبية",   full: "بطاقة أمازون الذهبية",   weight: 1,  color1: "#D8A324", color2: "#8A6206" },
  { label: "🥈", sub: "بطاقة فضية",    full: "بطاقة أمازون الفضية",    weight: 5,  color1: "#C7C7C7", color2: "#8A8A8A" },
  { label: "🥉", sub: "بطاقة برونزية", full: "بطاقة أمازون البرونزية", weight: 15, color1: "#B5651D", color2: "#7A3E10" }
];

/* ====================================================================
   جوايز وضع "العروض الذهبية" - بتتفعّل لو الرابط فيه ?mode=golden
   (Placeholder مبدئي - عدّليها زي ما تحبي)
   ==================================================================== */
const goldenPrizes = [
  { label: "100", sub: "جنيه", full: "100 جنيه",                weight: 0.05, color1: "#2E3A6B", color2: "#161B33" },
  { label: "50",  sub: "جنيه", full: "50 جنيه",                 weight: 0.3,  color1: "#FF9A3D", color2: "#D9600C" },
  { label: "20",  sub: "جنيه", full: "20 جنيه",                 weight: 2,    color1: "#2FBF9F", color2: "#177A64" },
  { label: "🥇",  sub: "بطاقة ذهبية كبيرة", full: "بطاقة أمازون الذهبية الكبيرة", weight: 1,  color1: "#D8A324", color2: "#8A6206" },
  { label: "🥈",  sub: "بطاقة فضية كبيرة",  full: "بطاقة أمازون الفضية الكبيرة",  weight: 5,  color1: "#C7C7C7", color2: "#8A8A8A" },
  { label: "🥉",  sub: "بطاقة برونزية كبيرة", full: "بطاقة أمازون البرونزية الكبيرة", weight: 15, color1: "#B5651D", color2: "#7A3E10" }
];

const isGoldenMode = new URLSearchParams(window.location.search).get('mode') === 'golden';
const isSelectMode = new URLSearchParams(window.location.search).get('mode') === 'select';

/* ====================================================================
   وضع "الاختيار" - عجلة بصرية بس (بدون قيم حقيقية) بتختار عرض عشوائي
   قبل ما نطلع السؤال. القيم هنا شكلية للحماس بس، مش لها قيمة فعلية.
   ==================================================================== */
const selectPrizes = [
  { label: "🎁", sub: "عرض", full: "عرض", weight: 1, color1: "#2E3A6B", color2: "#161B33" },
  { label: "🏆", sub: "عرض", full: "عرض", weight: 1, color1: "#D8A324", color2: "#8A6206" },
  { label: "⭐", sub: "عرض", full: "عرض", weight: 1, color1: "#2FBF9F", color2: "#177A64" },
  { label: "🔥", sub: "عرض", full: "عرض", weight: 1, color1: "#FF9A3D", color2: "#D9600C" },
  { label: "🎯", sub: "عرض", full: "عرض", weight: 1, color1: "#C7C7C7", color2: "#8A8A8A" },
  { label: "💫", sub: "عرض", full: "عرض", weight: 1, color1: "#B5651D", color2: "#7A3E10" }
];

const activePrizes = isGoldenMode ? goldenPrizes : (isSelectMode ? selectPrizes : prizes);
if (isSelectMode) {
  document.querySelector('h1').textContent = 'عجلة اختيار العرض 🏆';
  document.querySelector('.sub').textContent = 'دوس ولف واكتشف عرض النهاردة 🎁';
  document.querySelector('.hint').textContent = 'بعد ما العجلة تقف، هيوصلك تفاصيل العرض والسؤال.';
}
if (isGoldenMode) {
  document.querySelector('h1').textContent = 'عجلة العروض الذهبية 🏆';
  document.querySelector('.sub').textContent = 'دوس ولف واكسب جوايز ذهبية أكبر 🏆';
}
/* ==================================================================== */

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const N = activePrizes.length;
const seg = (2 * Math.PI) / N;
const R = canvas.width / 2;

function drawWheel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < N; i++) {
    const start = i * seg - Math.PI / 2;
    const end = start + seg;

    ctx.beginPath();
    ctx.moveTo(R, R);
    ctx.arc(R, R, R, start, end);
    ctx.closePath();

    const mid = start + seg / 2;
    const x1 = R + Math.cos(mid) * R * 0.15;
    const y1 = R + Math.sin(mid) * R * 0.15;
    const x2 = R + Math.cos(mid) * R;
    const y2 = R + Math.sin(mid) * R;
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, activePrizes[i].color1);
    grad.addColorStop(1, activePrizes[i].color2);
    ctx.fillStyle = grad;
    ctx.fill();

    const shine = ctx.createRadialGradient(R, R, R * 0.1, R, R, R);
    shine.addColorStop(0, "rgba(255,255,255,0.28)");
    shine.addColorStop(0.4, "rgba(255,255,255,0.05)");
    shine.addColorStop(1, "rgba(0,0,0,0.12)");
    ctx.fillStyle = shine;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}
drawWheel();

const labelsLayer = document.getElementById('labels');
const LABEL_RADIUS_PERCENT = 58; // بعد النص عن مركز العجلة (بعيد عن المسمار الدهبي)
function drawLabels() {
  labelsLayer.innerHTML = "";
  for (let i = 0; i < N; i++) {
    const mid = i * seg + seg / 2 - Math.PI / 2;
    const midDeg = mid * (180 / Math.PI) + 90;
    const x = 50 + LABEL_RADIUS_PERCENT * Math.cos(mid);
    const y = 50 + LABEL_RADIUS_PERCENT * Math.sin(mid);

    const el = document.createElement('div');
    el.className = 'label';
    el.style.left = x + '%';
    el.style.top = y + '%';
    el.style.transform = `translate(-50%, -50%) rotate(${midDeg}deg)`;

    const bow = document.createElement('span');
    bow.className = 'bow';
    bow.textContent = '🎀';
    el.appendChild(bow);

    const amt = document.createElement('span');
    amt.className = 'amt';
    amt.textContent = activePrizes[i].label;
    el.appendChild(amt);

    const sub = document.createElement('span');
    sub.className = 'subtext';
    sub.textContent = activePrizes[i].sub;
    el.appendChild(sub);

    labelsLayer.appendChild(el);
  }
}
drawLabels();

const lightsRing = document.getElementById('lightsRing');
const BULB_COUNT = 16;
const BULB_RADIUS_PERCENT = 46.5;
for (let i = 0; i < BULB_COUNT; i++) {
  const angleRad = (i / BULB_COUNT) * 2 * Math.PI - Math.PI / 2;
  const x = 50 + BULB_RADIUS_PERCENT * Math.cos(angleRad);
  const y = 50 + BULB_RADIUS_PERCENT * Math.sin(angleRad);
  const bulb = document.createElement('div');
  bulb.className = 'bulb';
  bulb.style.left = x + '%';
  bulb.style.top = y + '%';
  lightsRing.appendChild(bulb);
}

function pickPrizeIndex() {
  const total = activePrizes.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (let i = 0; i < N; i++) {
    if (r < activePrizes[i].weight) return i;
    r -= activePrizes[i].weight;
  }
  return N - 1;
}

let spun = false;
const spinBtn = document.getElementById('spin');
const resultBox = document.getElementById('result');
const prizeText = document.getElementById('prizeText');
const wheelInner = document.querySelector('.gold-rim');
let currentRotation = 0;

/* ====================================================================
   رصيد اللفّات بيوصل من البوت في رابط الصفحة (?balance=3).
   لو الرصيد صفر أو مش موجود، الزرار يتعطّل تمامًا من الأول.
   (السيرفر/البوت بيتأكد من الرصيد الحقيقي تاني بعد اللف على أي حال،
   الشرط هنا بس عشان تجربة استخدام أوضح للعميل)
   ==================================================================== */
const urlParams = new URLSearchParams(window.location.search);
const availableSpins = parseInt(urlParams.get('balance') || '-1', 10);
const balanceProvided = urlParams.has('balance');

if (balanceProvided && availableSpins <= 0) {
  spinBtn.disabled = true;
  spinBtn.textContent = "معندكش لفّات متاحة 🚫";
  spun = true; // نمنع أي محاولة لف
}

spinBtn.addEventListener('click', () => {
  if (spun) return;
  spun = true;
  spinBtn.disabled = true;
  spinBtn.textContent = "بتلف...";

  const winnerIndex = pickPrizeIndex();
  const winnerMidAngleDeg = (winnerIndex * seg + seg / 2) * (180 / Math.PI);
  const fullSpins = 6 * 360;
  const target = fullSpins + (360 - winnerMidAngleDeg);
  currentRotation += target;

  canvas.style.transform = `rotate(${currentRotation}deg)`;
  labelsLayer.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(() => {
    prizeText.textContent = activePrizes[winnerIndex].full;
    resultBox.classList.add('show');
    spinBtn.textContent = "تم اللف 🎉";

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.sendData(JSON.stringify({
          type: isSelectMode ? "golden_select" : (isGoldenMode ? "golden_prize_result" : "wheel_result"),
          prize: activePrizes[winnerIndex].full,
          isWin: activePrizes[winnerIndex].isWin !== false,
          user_id: tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null
        }));
      }
    } catch (e) {}
  }, 5600);
});

try {
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
} catch (e) {}
</script>
</body>
</html>
