<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>إدارة وفر كاش</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#101828;font-family:Tahoma,"Segoe UI",Arial,sans-serif}.wrap{max-width:1220px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-size:27px;font-weight:800}.sub{color:#667085;margin-top:4px}.btn{border:0;border-radius:12px;padding:10px 15px;background:#fff;box-shadow:0 1px 4px #0001;cursor:pointer;font-weight:700}.primary{background:#101828;color:#fff}.danger{background:#fff0f0;color:#b42318}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{white-space:nowrap;border:1px solid #e7e7e7;background:#fff;border-radius:13px;padding:10px 15px;font-weight:700;cursor:pointer}.tab.active{background:#101828;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}.card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 1px 7px #0000000d}.card .v{font-size:24px;font-weight:800;margin-top:7px}.card .k{font-size:13px;color:#667085}.grid{display:grid;gap:12px}.row{background:#fff;border-radius:17px;padding:14px;box-shadow:0 1px 6px #0000000d}.hidden{display:none!important}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.select,.search,.code,.password{border:1px solid #d0d5dd;border-radius:12px;padding:11px 12px;background:#fff;font:inherit}.search{min-width:260px}.tablewrap{overflow:auto;background:#fff;border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:1040px}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:right;font-size:13px}.table th{background:#fafafa;position:sticky;top:0}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:#f2f4f7}.green{background:#e8f7ee;color:#067647}.gold{background:#fff4d6;color:#8a5b00}.blue{background:#eaf2ff;color:#175cd3}.red{background:#feeceb;color:#b42318}.redeem{display:grid;grid-template-columns:1.25fr .55fr 1.2fr .55fr;gap:10px;align-items:center}.small{font-size:12px;color:#667085}.notice{padding:12px;border-radius:12px;background:#fff4d6;margin:10px 0}.ok{background:#e8f7ee}.err{background:#feeceb}.sources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.source{background:#fff;border:1px solid #eee;border-radius:14px;padding:12px}.login{max-width:430px;margin:12vh auto;background:#fff;padding:24px;border-radius:22px;box-shadow:0 12px 40px #0001}.login h2{margin:0 0 8px}.login .password{width:100%;margin:12px 0}.link{color:#175cd3;font-weight:700;cursor:pointer}.section-title{font-size:19px;font-weight:800;margin:18px 0 8px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.sources{grid-template-columns:1fr 1fr}.redeem{grid-template-columns:1fr}.brand{font-size:22px}.wrap{padding:12px}}@media(max-width:480px){.sources{grid-template-columns:1fr}}
</style></head><body>
<div id="loginBox" class="login hidden"><h2>🔐 دخول الإدارة</h2><div class="sub">لوحة وفر كاش المركزية على الويب</div><input id="adminPass" class="password" type="password" placeholder="كلمة سر الإدارة"><button class="btn primary" style="width:100%" onclick="webLogin()">دخول</button><div id="loginMsg" class="small" style="margin-top:10px"></div></div>
<div id="app" class="wrap hidden">
<div class="top"><div><div class="brand">⚙️ لوحة إدارة وفر كاش المركزية</div><div class="sub">Telegram + Web في مكان واحد</div></div><div><button class="btn" onclick="refreshAll()">↻ تحديث</button> <button id="logoutBtn" class="btn danger" onclick="webLogout()">خروج</button></div></div>
<div id="notice"></div>
<div class="tabs"><button class="tab active" data-tab="overview">🏠 نظرة عامة</button><button class="tab" data-tab="redeems">🎁 الاستبدالات</button><button class="tab" data-tab="customers">👥 العملاء</button><button class="tab" data-tab="reports">📊 التقارير</button></div>
<section id="overview"><div class="filters"><select id="periodOverview" class="select" onchange="loadOverview()"><option value="today">اليوم</option><option value="7d">آخر 7 أيام</option><option value="30d">آخر 30 يوم</option><option value="all" selected>كل الوقت</option></select></div><div id="overviewCards" class="cards"></div><div class="section-title">مصادر عملاء الويب</div><div id="sources" class="sources"></div></section>
<section id="redeems" class="hidden"><div id="redeemSummary" class="cards"></div><div id="redeemList" class="grid"></div></section>
<section id="customers" class="hidden"><div class="filters"><select id="periodCustomers" class="select" onchange="loadCustomers()"><option value="today">اليوم</option><option value="7d">آخر 7 أيام</option><option value="30d">آخر 30 يوم</option><option value="all" selected>كل الوقت</option></select><input id="search" class="search" placeholder="موبايل / Username / Telegram ID"><button class="btn primary" onclick="loadCustomers()">بحث</button><button class="btn" onclick="downloadCSV()">📥 CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>العميل</th><th>المنصة</th><th>الموبايل</th><th>المصدر</th><th>Telegram</th><th>لفات</th><th>ضغطات/منتجات</th><th>مدفوع</th><th>معلق</th><th>الرصيد</th></tr></thead><tbody id="customersBody"></tbody></table></div></section>
<section id="reports" class="hidden"><div class="filters"><select id="periodReports" class="select" onchange="loadReports()"><option value="today">اليوم</option><option value="7d">آخر 7 أيام</option><option value="30d">آخر 30 يوم</option><option value="all" selected>كل الوقت</option></select></div><div id="reportCards" class="cards"></div><div class="notice">العائد المتوقع مبني على EPC/ERP المسجل للمنتجات، وليس إيرادًا مؤكدًا من أمازون.</div></section>
<section id="detail" class="hidden"><div class="filters"><button class="btn" onclick="backCustomers()">← رجوع</button></div><div id="detailBox" class="grid"></div></section>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){try{tg.ready();tg.expand();}catch(e){}} const initData=tg?.initData||''; let customersCache=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function n(v){return Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2})}
function note(msg,type='ok'){document.getElementById('notice').innerHTML=`<div class="notice ${type}">${esc(msg)}</div>`;setTimeout(()=>document.getElementById('notice').innerHTML='',3500)}
async function api(path,opt={}){opt.headers={...(opt.headers||{})};if(initData)opt.headers['X-Telegram-Init-Data']=initData;if(opt.body)opt.headers['Content-Type']='application/json';let r=await fetch(path,opt);let j={};try{j=await r.json()}catch(e){};if(!r.ok||!j.ok)throw new Error(j.error||'حصل خطأ');return j.data}
function cards(arr){return arr.map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}
async function detectAuth(){if(initData){document.getElementById('app').classList.remove('hidden');document.getElementById('logoutBtn').classList.add('hidden');refreshAll();return}try{await api('/api/admin/session');document.getElementById('app').classList.remove('hidden');refreshAll()}catch(e){document.getElementById('loginBox').classList.remove('hidden')}}
async function webLogin(){let p=document.getElementById('adminPass').value;try{await api('/api/admin/web-login',{method:'POST',body:JSON.stringify({password:p})});location.reload()}catch(e){document.getElementById('loginMsg').textContent=e.message}}
async function webLogout(){try{await api('/api/admin/web-logout',{method:'POST'});}catch(e){} location.reload()}
async function loadOverview(){try{let p=document.getElementById('periodOverview').value,s=await api('/api/admin/central-summary?period='+p);document.getElementById('overviewCards').innerHTML=cards([['👥 كل العملاء',n(s.users_total)],['🌐 حسابات ويب',n(s.web_accounts_total)],['🔗 مربوط Telegram',n(s.telegram_linked)],['🌐 Web فقط',n(s.web_only)],['✈️ Telegram فقط',n(s.telegram_only)],['👀 زيارات الويب',n(s.web_visits)],['🛒 ضغطات أمازون',n(s.offer_clicks)],['👤 عملاء ضغطوا',n(s.unique_clickers)],['🎡 اللفات',n(s.spin_count)],['🎁 قيمة الجوائز',n(s.claimed_prizes)+' ج'],['⏳ طلبات معلقة',n(s.pending_count)],['💰 قيمة المعلق',n(s.pending_total)+' ج']]);document.getElementById('sources').innerHTML=(s.sources||[]).length?(s.sources||[]).map(x=>`<div class="source"><b>${esc(x.source||'direct')}</b><div class="small">${n(x.accounts)} عميل • ${n(x.events)} زيارة</div></div>`).join(''):'<div class="row">لا توجد بيانات مصادر بعد.</div>'}catch(e){note(e.message,'err')}}
async function loadRedeems(){try{let [s,rows]=await Promise.all([api('/api/admin/summary?period=all'),api('/api/admin/redemptions')]);document.getElementById('redeemSummary').innerHTML=cards([['⏳ طلبات معلقة',n(s.pending_count)],['💰 قيمة المعلق',n(s.pending_total)+' ج'],['✅ إجمالي المدفوع',n(s.paid_total)+' ج'],['💳 أرصدة لم تُطلب',n(s.unrequested_balance)+' ج']]);let el=document.getElementById('redeemList');el.innerHTML=rows.length?rows.map(r=>`<div class="row redeem" id="rr-${r.id}"><div><b>${r.username?'@'+esc(r.username):'User '+r.user_id}</b><div class="small">طلب #${r.id} • ${esc(r.requested_at)}</div></div><div><b>${n(r.amount)} جنيه</b></div><input class="code" id="code-${r.id}" placeholder="كود بطاقة الهدية"><button class="btn primary" onclick="sendCode(${r.id})">إرسال الكود</button></div>`).join(''):'<div class="row">✅ مفيش طلبات استبدال معلقة.</div>'}catch(e){note(e.message,'err')}}
async function sendCode(id){let code=document.getElementById('code-'+id).value.trim();if(!code){note('اكتبي كود بطاقة الهدية','err');return}if(!confirm('إرسال الكود واعتبار الطلب تم الاستبدال؟'))return;try{let r=await api('/api/admin/send-gift-code',{method:'POST',body:JSON.stringify({request_id:id,gift_code:code})});document.getElementById('rr-'+id)?.remove();note(r.delivery==='telegram+web'?'✅ الكود ظهر على الويب واتبعث على Telegram':'✅ الكود ظهر للعميل على الويب');refreshAll()}catch(e){note(e.message,'err')}}
function platform(r){if(r.has_web_account&&r.telegram_user_id)return '<span class="badge blue">Web + Telegram</span>';if(r.has_web_account)return '<span class="badge gold">Web</span>';return '<span class="badge">Telegram</span>'}
async function loadCustomers(){try{let p=document.getElementById('periodCustomers').value,q=encodeURIComponent(document.getElementById('search').value||''),rows=await api('/api/admin/central-customers?period='+p+'&search='+q);customersCache=rows;document.getElementById('customersBody').innerHTML=rows.map(r=>`<tr><td class="link" onclick="openCustomer(${r.user_id})">${r.username?'@'+esc(r.username):esc(r.user_id)}</td><td>${platform(r)}</td><td>${esc(r.phone_e164||'—')}</td><td>${esc(r.source_last||r.source_first||'—')}</td><td>${r.telegram_user_id?'<span class="badge green">مربوط</span>':'—'}</td><td>${n(r.spin_count)}</td><td>${n(r.products_shown)}</td><td>${n(r.paid_total)} ج</td><td>${n(r.pending_total)} ج</td><td>${n(r.gift_balance)} ج</td></tr>`).join('')}catch(e){note(e.message,'err')}}
async function openCustomer(id){try{let p=document.getElementById('periodCustomers').value,r=await api('/api/admin/customer?period='+p+'&user_id='+id);document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById('detail').classList.remove('hidden');let wa=r.web_account||{};let products=(r.recent_products||[]).map(x=>`<tr><td>${esc(x.asin)}</td><td>${n(x.epc)}</td><td>${x.was_correct===1?'✅':'❌'}</td><td>${x.was_correct===1?n(x.reward_value):'0'}</td></tr>`).join('');let red=(r.redemptions||[]).map(x=>`<tr><td>#${x.id}</td><td>${n(x.amount)}</td><td>${esc(x.status)}</td><td>${esc(x.gift_code||'—')}</td></tr>`).join('');document.getElementById('detailBox').innerHTML=`<div class="row"><h3>👤 ${r.username?'@'+esc(r.username):r.user_id}</h3><div class="small">${wa.phone_e164?'📱 '+esc(wa.phone_e164)+' • ':''}${wa.source_last?'المصدر: '+esc(wa.source_last)+' • ':''}${wa.telegram_user_id?'Telegram مربوط':'Telegram غير مربوط'}</div><div class="cards">${cards([['🎡 اللفات',r.spin_count],['🛍️ المنتجات',r.products_shown],['🎁 أرباح العميل',n(r.product_rewards)+' ج'],['✅ مدفوع',n(r.paid_total)+' ج'],['⏳ معلق',n(r.pending_total)+' ج'],['💳 الرصيد',n(r.gift_balance)+' ج']])}</div></div><div class="row"><h3>آخر المنتجات/الأسئلة</h3><div class="tablewrap"><table class="table"><thead><tr><th>ASIN</th><th>EPC</th><th>الإجابة</th><th>المكسب</th></tr></thead><tbody>${products}</tbody></table></div></div><div class="row"><h3>الاستبدالات</h3><div class="tablewrap"><table class="table"><thead><tr><th>الطلب</th><th>المبلغ</th><th>الحالة</th><th>الكود</th></tr></thead><tbody>${red}</tbody></table></div></div>`;window.scrollTo(0,0)}catch(e){note(e.message,'err')}}
function backCustomers(){document.getElementById('detail').classList.add('hidden');document.getElementById('customers').classList.remove('hidden')}
async function loadReports(){try{let p=document.getElementById('periodReports').value,s=await api('/api/admin/summary?period='+p);document.getElementById('reportCards').innerHTML=cards([['👥 العملاء',n(s.users)],['🎡 عدد اللفات',n(s.spin_count)],['🛍️ المنتجات الظاهرة',n(s.products_shown)],['💵 ERP/EPC متوقع',n(s.expected_revenue)+' ج'],['🎁 مكافآت المنتجات',n(s.product_rewards)+' ج'],['🧾 طلبات الاستبدال',n(s.requested_count)],['✅ المدفوع',n(s.paid_total)+' ج'],['⏳ لم يُدفع',n(s.pending_total)+' ج'],['📈 صافي متوقع',n(s.expected_net)+' ج']])}catch(e){note(e.message,'err')}}
function downloadCSV(){let h=['user_id','username','platform','phone','source','telegram_linked','spins','products','paid','pending','balance'],lines=[h.join(',')];for(let r of customersCache){let pl=r.has_web_account?(r.telegram_user_id?'web+telegram':'web'):'telegram';lines.push([r.user_id,JSON.stringify(r.username||''),pl,JSON.stringify(r.phone_e164||''),JSON.stringify(r.source_last||r.source_first||''),r.telegram_user_id?'yes':'no',r.spin_count,r.products_shown,r.paid_total,r.pending_total,r.gift_balance].join(','))}let b=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='wafr-central-customers.csv';a.click();URL.revokeObjectURL(a.href)}
function refreshAll(){loadOverview();loadRedeems();loadCustomers();loadReports()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='overview')loadOverview();if(b.dataset.tab==='redeems')loadRedeems();if(b.dataset.tab==='customers')loadCustomers();if(b.dataset.tab==='reports')loadReports()});detectAuth();
</script></body></html>
