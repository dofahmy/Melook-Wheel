<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>وفر كاش - لوحة الإدارة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#171717;background:#f6f7f8}
*{box-sizing:border-box} body{margin:0}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:24px;font-weight:900}.sub{color:#666;font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0}.tab,.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer;background:white;box-shadow:0 1px 4px #0001;white-space:nowrap}.tab.active,.btn.primary{background:#111;color:white}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:white;border-radius:16px;padding:14px;box-shadow:0 1px 5px #0001}.card b{display:block;font-size:21px;margin-top:6px}.grid{display:grid;gap:10px;margin-top:14px}.row{background:white;border-radius:15px;padding:13px;box-shadow:0 1px 5px #0001}.redeem{display:grid;grid-template-columns:1.3fr .7fr 1.4fr .7fr;gap:10px;align-items:center}.code{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;font-size:15px;direction:ltr}.btn.send{background:#137333;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.select,.search{border:1px solid #ddd;border-radius:10px;padding:10px;background:white}.search{min-width:230px}.tablewrap{overflow:auto;background:white;border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:right;font-size:14px}.link{color:#065fd4;cursor:pointer;font-weight:800}.status{font-weight:800}.hidden{display:none!important}.notice{padding:12px;border-radius:12px;background:#fff4cf;margin:10px 0}.ok{background:#e7f6eb}.err{background:#fde8e7}.detail{white-space:pre-wrap;line-height:1.7}.small{font-size:12px;color:#666}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.redeem{grid-template-columns:1fr}.brand{font-size:20px}}
</style>
</head><body><div class="wrap">
<div class="top"><div><div class="brand">⚙️ لوحة إدارة وفر كاش</div><div class="sub">المستحقات + أكواد بطاقات الهدايا + التقارير</div></div><button class="btn" onclick="refreshAll()">↻ تحديث</button></div>
<div id="notice"></div>
<div class="tabs"><button class="tab active" data-tab="redeems">💰 طلبات الاستبدال</button><button class="tab" data-tab="reports">📊 التقارير</button><button class="tab" data-tab="customers">👥 العملاء</button></div>

<section id="redeems"><div id="redeemSummary" class="cards"></div><div id="redeemList" class="grid"></div></section>
<section id="reports" class="hidden"><div class="filters"><select id="period" class="select" onchange="loadReports();loadCustomers()"><option value="today">اليوم</option><option value="7d">آخر 7 أيام</option><option value="30d">آخر 30 يوم</option><option value="all" selected>كل الوقت</option></select></div><div id="reportCards" class="cards"></div><div class="notice">العائد المتوقع مبني على قيمة EPC/ERP المسجلة عند ظهور المنتجات، وليس إيرادًا مؤكدًا تم تحصيله من أمازون.</div></section>
<section id="customers" class="hidden"><div class="filters"><input id="search" class="search" placeholder="ابحثي باليوزرنيم أو Telegram ID"><button class="btn primary" onclick="loadCustomers()">بحث</button><button class="btn" onclick="downloadCSV()">📥 Excel/CSV</button></div><div class="tablewrap"><table class="table"><thead><tr><th>العميل</th><th>لفات</th><th>منتجات</th><th>ERP متوقع</th><th>كسب من المنتجات</th><th>مدفوع</th><th>معلق</th><th>رصيد حالي</th><th>صافي متوقع</th></tr></thead><tbody id="customersBody"></tbody></table></div></section>
<section id="detail" class="hidden"><button class="btn" onclick="backCustomers()">← رجوع</button><div id="detailBox" class="grid"></div></section>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const initData=tg?.initData||''; let customersCache=[];
function n(v){return Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function note(msg,type='ok'){document.getElementById('notice').innerHTML=`<div class="notice ${type}">${esc(msg)}</div>`;setTimeout(()=>document.getElementById('notice').innerHTML='',3500)}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-Telegram-Init-Data':initData};if(opt.body)opt.headers['Content-Type']='application/json';let r=await fetch(path,opt);let j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'حصل خطأ');return j.data}
function cards(obj){return obj.map(([t,v])=>`<div class="card"><span>${t}</span><b>${v}</b></div>`).join('')}
async function loadRedeems(){try{let [s,rows]=await Promise.all([api('/api/admin/summary?period=all'),api('/api/admin/redemptions')]);document.getElementById('redeemSummary').innerHTML=cards([['⏳ طلبات معلقة',s.pending_count],['💰 قيمة المعلق',n(s.pending_total)+' ج'],['✅ إجمالي المدفوع',n(s.paid_total)+' ج'],['💳 أرصدة لم تُطلب',n(s.unrequested_balance)+' ج']]);let el=document.getElementById('redeemList');if(!rows.length){el.innerHTML='<div class="row">✅ مفيش طلبات استبدال معلقة.</div>';return;}el.innerHTML=rows.map(r=>`<div class="row redeem" id="rr-${r.id}"><div><b>${r.username?'@'+esc(r.username):'ID '+r.user_id}</b><div class="small">طلب #${r.id} • ${esc(r.requested_at)}</div></div><div><b>${n(r.amount)} جنيه</b></div><input class="code" id="code-${r.id}" placeholder="اكتبي كود بطاقة الهدية"><button class="btn send" onclick="sendCode(${r.id})">إرسال الكود</button></div>`).join('')}catch(e){note(e.message,'err')}}
async function sendCode(id){let inp=document.getElementById('code-'+id),code=inp.value.trim();if(!code){note('اكتبي كود بطاقة الهدية الأول','err');return}if(!confirm('إرسال الكود للعميل واعتبار الطلب مستبدل؟'))return;try{await api('/api/admin/send-gift-code',{method:'POST',body:JSON.stringify({request_id:id,gift_code:code})});document.getElementById('rr-'+id)?.remove();note('✅ اتبعت الكود للعميل واتسجل الطلب مدفوع');loadReports()}catch(e){note(e.message,'err')}}
async function loadReports(){try{let p=document.getElementById('period').value,s=await api('/api/admin/summary?period='+p);document.getElementById('reportCards').innerHTML=cards([['👥 العملاء',n(s.users)],['🎡 عدد اللفات',n(s.spin_count)],['🛍️ المنتجات الظاهرة',n(s.products_shown)],['💵 ERP/EPC متوقع',n(s.expected_revenue)+' ج'],['🎁 مكافآت المنتجات',n(s.product_rewards)+' ج'],['🧾 طلبات الاستبدال',n(s.requested_count)],['✅ المدفوع',n(s.paid_total)+' ج'],['⏳ لم يُدفع',n(s.pending_total)+' ج'],['📈 صافي العائد المتوقع',n(s.expected_net)+' ج']])}catch(e){note(e.message,'err')}}
async function loadCustomers(){try{let p=document.getElementById('period').value,q=encodeURIComponent(document.getElementById('search').value);let rows=await api(`/api/admin/customers?period=${p}&search=${q}`);customersCache=rows;document.getElementById('customersBody').innerHTML=rows.map(r=>`<tr><td><span class="link" onclick="showCustomer(${r.user_id})">${r.username?'@'+esc(r.username):r.user_id}</span></td><td>${n(r.spin_count)}</td><td>${n(r.products_shown)}</td><td>${n(r.expected_revenue)}</td><td>${n(r.product_rewards)}</td><td>${n(r.paid_total)}</td><td>${n(r.pending_total)}</td><td>${n(r.gift_balance)}</td><td>${n(Number(r.expected_revenue)-Number(r.product_rewards))}</td></tr>`).join('')}catch(e){note(e.message,'err')}}
async function showCustomer(id){try{let p=document.getElementById('period').value,r=await api(`/api/admin/customer?user_id=${id}&period=${p}`);document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById('detail').classList.remove('hidden');let products=r.recent_products.map(x=>`<tr><td>${esc(x.asin)}</td><td>${n(x.epc)}</td><td>${x.was_correct===1?'✅':'❌'}</td><td>${x.was_correct===1?n(x.reward_value):'0'}</td></tr>`).join('');let red=r.redemptions.map(x=>`<tr><td>#${x.id}</td><td>${n(x.amount)}</td><td>${esc(x.status)}</td><td>${x.gift_code?esc(x.gift_code):'—'}</td></tr>`).join('');document.getElementById('detailBox').innerHTML=`<div class="row"><h3>👤 ${r.username?'@'+esc(r.username):r.user_id}</h3><div class="cards">${cards([['🎡 اللفات',r.spin_count],['🛍️ المنتجات',r.products_shown],['💵 ERP متوقع',n(r.expected_revenue)+' ج'],['🎁 كسب من المنتجات',n(r.product_rewards)+' ج'],['🧾 مرات الاستبدال',n(r.redemption_count)],['✅ مدفوع',n(r.paid_total)+' ج'],['⏳ معلق',n(r.pending_total)+' ج'],['💳 رصيد حالي',n(r.gift_balance)+' ج'],['📈 صافي متوقع',n(r.expected_net)+' ج']])}</div></div><div class="row"><h3>آخر المنتجات</h3><div class="tablewrap"><table class="table"><thead><tr><th>ASIN</th><th>ERP/EPC</th><th>الإجابة</th><th>مكسب العميل</th></tr></thead><tbody>${products}</tbody></table></div></div><div class="row"><h3>الاستبدالات</h3><div class="tablewrap"><table class="table"><thead><tr><th>الطلب</th><th>المبلغ</th><th>الحالة</th><th>الكود</th></tr></thead><tbody>${red}</tbody></table></div></div>`}catch(e){note(e.message,'err')}}
function backCustomers(){document.getElementById('detail').classList.add('hidden');document.getElementById('customers').classList.remove('hidden');}
function downloadCSV(){let head=['user_id','username','spins','products','expected_erp','customer_rewards','paid','pending','current_balance','expected_net'];let lines=[head.join(',')];for(let r of customersCache){lines.push([r.user_id,JSON.stringify(r.username||''),r.spin_count,r.products_shown,r.expected_revenue,r.product_rewards,r.paid_total,r.pending_total,r.gift_balance,Number(r.expected_revenue)-Number(r.product_rewards)].join(','))}let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='wafr-customers-report.csv';a.click();URL.revokeObjectURL(a.href)}
function refreshAll(){loadRedeems();loadReports();loadCustomers()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden');if(b.dataset.tab==='reports')loadReports();if(b.dataset.tab==='customers')loadCustomers()});
refreshAll();
</script></body></html>
